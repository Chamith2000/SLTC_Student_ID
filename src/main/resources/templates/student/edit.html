<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Edit Student</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>
    <style>
        #cropperContainer {
            max-height: 420px;
            overflow: hidden;
            background: #1a1a1a;
            border-radius: 6px;
        }
        #cropperContainer img {
            max-width: 100%;
            display: block;
        }
        .cropper-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .cropper-controls .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #cropRatioGroup .btn {
            font-size: 12px;
            padding: 4px 10px;
        }
        .aspect-label {
            font-size: 12px;
            color: #6c757d;
            margin-right: 4px;
        }
    </style>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Edit Student</h2>
            <p class="text-muted">Modify student details and update the record.</p>
        </div>
        <div class="col-6 text-right">
            <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <!-- Student Edit Form -->
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-4">Edit Student Details</h4>
            <form th:action="@{/student/update}" th:object="${studentDTO}" method="post" enctype="multipart/form-data">

                <!-- Hidden ID Field -->
                <input type="hidden" th:field="*{id}"/>

                <!-- Profile Image Preview and Upload -->
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Profile Image</label>
                    <div class="col-sm-10">
                        <div class="upload-photo" style="margin-top: 10px;">
                            <img th:src="${studentDTO.filePath} ?: '/images/student-id/default-avatar.jpg'"
                                 id="imagePreview" src="/images/student-id/default-avatar.jpg" alt="Profile Image" class="img-thumbnail mb-2">
                        </div>

                        <div class="d-flex gap-2">
                            <input type="file" class="form-control" id="image" name="image" accept="image/*" onchange="openCropModal(event)">
                            <button type="button" class="btn btn-primary" onclick="openCamera()">Take a Photo</button>
                        </div>
                    </div>
                </div>

                <!-- First Name -->
                <div class="form-group row">
                    <label for="firstName" class="col-sm-2 col-form-label">First Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="firstName" name="firstName" th:field="*{firstName}" required>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="form-group row">
                    <label for="lastName" class="col-sm-2 col-form-label">Last Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="lastName" name="lastName" th:field="*{lastName}" required>
                    </div>
                </div>

                <!-- Display Name -->
                <div class="form-group row">
                    <label for="displayName" class="col-sm-2 col-form-label">Display Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="displayName" name="displayName" th:field="*{displayName}" required>
                    </div>
                </div>

                <!-- Registration Number -->
                <div class="form-group row">
                    <label for="regNo" class="col-sm-2 col-form-label">Reg No</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="regNo" name="regNo" th:field="*{regNo}" required>
                    </div>
                </div>

                <!-- NIC -->
                <div class="form-group row">
                    <label for="nic" class="col-sm-2 col-form-label">NIC</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nic" name="nic" th:field="*{nic}" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group row">
                    <label for="phoneNumber" class="col-sm-2 col-form-label">Phone Number</label>
                    <div class="col-sm-10">
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" th:field="*{phoneNumber}" required>
                    </div>
                </div>

                <!-- Course Dropdown -->
                <div class="form-group row">
                    <label for="courseId" class="col-sm-2 col-form-label">Course</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="courseId" name="courseId" th:field="*{courseId}" required>
                            <option value="" disabled>Select a course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}"></option>
                        </select>
                    </div>
                </div>

                <!-- Batch Dropdown -->
                <div class="form-group row">
                    <label for="batchId" class="col-sm-2 col-form-label">Batch</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="batchId" name="batchId" th:field="*{batchId}" required>
                            <option value="" disabled>Select a batch</option>
                            <option th:each="batch : ${batches}"
                                    th:value="${batch.id}"
                                    th:text="${batch.name}"></option>
                        </select>
                    </div>
                </div>

                <!-- Issued Date -->
                <div class="form-group row">
                    <label for="issuedDate" class="col-sm-2 col-form-label">Issued Date</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="issuedDate" name="issuedDate"
                               th:value="${studentDTO.issuedDate != null ? #dates.format(studentDTO.issuedDate, 'yyyy-MM-dd') : ''}" required>
                    </div>
                </div>

                <!-- Expiry Date -->
                <div class="form-group row">
                    <label for="expiryDate" class="col-sm-2 col-form-label">Expiry Date</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="expiryDate" name="expiryDate"
                               th:value="${studentDTO.expiryDate != null ? #dates.format(studentDTO.expiryDate, 'yyyy-MM-dd') : ''}" required>
                    </div>
                </div>

                <!-- Confirmation Status -->
                <div class="form-group row">
                    <label for="confirmed" class="col-sm-2 col-form-label">Confirmation Status</label>
                    <div class="col-sm-10" style="margin-top: 5px;">
                        <span id="confirmed"
                              style="font-weight: bold; font-size: 0.9em; text-align: left; display: block; color: #0c85d0"
                              th:text="${studentDTO.confirmationStatus == T(com.oexil.studentreg.enums.ConfirmationStatus).UNCONFIRMED ? 'Not yet confirmed' : (studentDTO.confirmed == true ? 'Confirmed (' + #dates.format(studentDTO.confirmedActionTime, 'dd/MM/yyyy HH:mm:ss') + ')' : 'Confirmation Rejected (' + #dates.format(studentDTO.confirmedActionTime, 'dd/MM/yyyy HH:mm:ss') + ')')}"></span>
                    </div>
                </div>

                <!-- Corrections (Visible only if confirmed is false) -->
                <div class="form-group row" th:if="${studentDTO.confirmed == false}">
                    <label for="correction" class="col-sm-2 col-form-label">Corrections</label>
                    <div class="col-sm-10" style="margin-top: 5px;">
                        <span id="correction"
                              style="font-weight: bold; font-size: 0.9em; text-align: left; display: block; color: #0c85d0"
                              th:text="${studentDTO.corrections ?: 'No corrections submitted'}" disabled></span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-group row mt-4">
                    <div class="col-sm-12 text-right">
                        <button type="submit" class="btn btn-success">Update Student</button>
                        <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- ===== IMAGE CROP MODAL ===== -->
    <div class="modal fade" id="cropModal" tabindex="-1" role="dialog" aria-labelledby="cropModalLabel" aria-hidden="true"
         data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cropModalLabel">Crop Profile Image</h5>
                    <button type="button" class="close" onclick="cancelCrop()" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="cropperContainer">
                        <img id="cropperImage" src="" alt="Crop preview">
                    </div>

                    <div class="cropper-controls mt-3">
                        <span class="aspect-label">Ratio:</span>
                        <div id="cropRatioGroup" class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-outline-secondary active" onclick="setAspectRatio(1, this)" title="1:1 Square">1:1</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="setAspectRatio(3/4, this)" title="3:4 Portrait">3:4</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="setAspectRatio(NaN, this)" title="Free">Free</button>
                        </div>

                        <div class="ml-auto d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-icon btn-sm" onclick="cropperInstance.rotate(-90)" title="Rotate Left">&#8634;</button>
                            <button type="button" class="btn btn-outline-secondary btn-icon btn-sm" onclick="cropperInstance.rotate(90)" title="Rotate Right">&#8635;</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="flipHorizontal()" title="Flip Horizontal">&#8596;</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cancelCrop()">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="applyCrop()">&#10003; Apply Crop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera Capture Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" role="dialog" aria-labelledby="cameraModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Take a Photo</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <video id="camera" autoplay style="width: 100%; max-height: 300px;"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <button type="button" class="btn btn-success mt-2" onclick="capturePhoto()">Capture</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <script>
        // ─── Crop modal state ──────────────────────────────────────────────────────
        let cropperInstance = null;
        let flipScaleX = 1;

        function openCropModal(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                loadImageIntoCropper(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function loadImageIntoCropper(dataURL) {
            const cropImg = document.getElementById('cropperImage');

            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }

            flipScaleX = 1;

            document.querySelectorAll('#cropRatioGroup .btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#cropRatioGroup .btn').classList.add('active');

            cropImg.src = dataURL;

            $('#cropModal').modal('show');

            $('#cropModal').one('shown.bs.modal', function () {
                cropperInstance = new Cropper(cropImg, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 0.8,
                    movable: true,
                    zoomable: true,
                    rotatable: true,
                    scalable: true,
                    responsive: true,
                    background: true,
                });
            });
        }

        function setAspectRatio(ratio, btn) {
            if (cropperInstance) cropperInstance.setAspectRatio(ratio);
            document.querySelectorAll('#cropRatioGroup .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function flipHorizontal() {
            if (!cropperInstance) return;
            flipScaleX = flipScaleX === 1 ? -1 : 1;
            cropperInstance.scaleX(flipScaleX);
        }

        function applyCrop() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                width: 400,
                height: 400,
                imageSmoothingQuality: 'high',
            });

            const imagePreview = document.getElementById('imagePreview');
            imagePreview.src = canvas.toDataURL('image/jpeg', 0.92);
            imagePreview.style.display = 'block';

            canvas.toBlob(function (blob) {
                const croppedFile = new File([blob], 'profile_cropped.jpg', { type: 'image/jpeg' });

                const fileInput = document.getElementById('image');
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(croppedFile);
                fileInput.files = dataTransfer.files;

                cropperInstance.destroy();
                cropperInstance = null;
                $('#cropModal').modal('hide');
            }, 'image/jpeg', 0.92);
        }

        function cancelCrop() {
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            document.getElementById('image').value = '';
            $('#cropModal').modal('hide');
        }

        // ─── Camera ───────────────────────────────────────────────────────────────
        let videoStream;

        function openCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    videoStream = stream;
                    document.getElementById('camera').srcObject = stream;
                    $('#cameraModal').modal('show');
                })
                .catch(error => {
                    alert("Camera access denied or not available.");
                    console.error(error);
                });
        }

        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataURL = canvas.toDataURL('image/png');

            videoStream.getTracks().forEach(track => track.stop());
            $('#cameraModal').modal('hide');

            $('#cameraModal').one('hidden.bs.modal', function () {
                loadImageIntoCropper(imageDataURL);
            });
        }
    </script>

</section>
</body>
</html>
