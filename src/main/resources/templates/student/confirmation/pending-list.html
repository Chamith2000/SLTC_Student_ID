<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Student List</title>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Pending Student List</h2>
            <p class="text-muted">Review and process students awaiting confirmation.</p>
        </div>
        <!-- Top Bar div eke col-6 passe -->
        <div class="col-6 text-end">
            <a th:href="@{/student/generate-all-ids(page=0, size=1000)}"
               target="_blank"
               class="btn btn-primary">
                <i class="fas fa-print"></i> Print All IDs
            </a>
        </div>
    </div>

    <!-- Student Table -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Student List</h4>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Reg Number</th>
                                <th>Phone Number</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student, iterStat : ${students}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.regNo}"></td>
                                <td th:text="${student.phoneNumber}"></td>
                                <td>
                                    <!-- Edit Button -->
                                    <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-sm btn-info">
                                        Edit
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="5" class="text-center">No students found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔥 Hidden iframe for ID Card -->
    <iframe id="printFrame" style="display:none;"></iframe>
</section>
</body>
</html>
