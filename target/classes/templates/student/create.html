<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Student Registration</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>
    <style>
        /* Crop modal styles */
        #cropperContainer {
            max-height: 420px;
            overflow: hidden;
            background: #1a1a1a;
            border-radius: 6px;
        }
        #cropperContainer img {
            max-width: 100%;
            display: block;
        }
        .cropper-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .cropper-controls .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #cropRatioGroup .btn {
            font-size: 12px;
            padding: 4px 10px;
        }
        .aspect-label {
            font-size: 12px;
            color: #6c757d;
            margin-right: 4px;
        }
    </style>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Student Registration</h2>
            <p class="text-muted">Register a new student in the system.</p>
        </div>
        <div class="col-6 text-right">
            <button class="btn btn-primary" data-toggle="modal" data-target="#createBatchModal">Bulk Registration</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <!-- Student Registration Form -->
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-4">Register a New Student</h4>
            <form th:action="@{/student/student-register}" th:object="${studentDTO}" method="post" enctype="multipart/form-data">

                <!-- Image Upload and Preview -->
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Profile Image</label>
                    <div class="col-sm-10">
                        <!-- Default Profile Image -->
                        <div class="upload-photo" style="margin-top: 10px;">
                            <img id="imagePreview" src="/images/student-id/default-avatar.jpg" alt="Profile Image" class="img-thumbnail mb-2">
                        </div>

                        <!-- Buttons in a row -->
                        <div class="d-flex gap-2">
                            <!-- Browse Button -->
                            <input type="file" class="form-control" id="image" name="image" accept="image/*" onchange="openCropModal(event)">

                            <!-- Take Photo Button -->
                            <button type="button" class="btn btn-primary" onclick="openCamera()">Take a Photo</button>
                        </div>
                    </div>
                </div>

                <!-- First Name -->
                <div class="form-group row">
                    <label for="firstName" class="col-sm-2 col-form-label">First Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="firstName" name="firstName" th:field="*{firstName}" placeholder="Enter first name" required>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="form-group row">
                    <label for="lastName" class="col-sm-2 col-form-label">Last Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="lastName" name="lastName" th:field="*{lastName}" placeholder="Enter last name" required>
                    </div>
                </div>

                <!-- Display Name -->
                <div class="form-group row">
                    <label for="displayName" class="col-sm-2 col-form-label">Display Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="displayName" name="displayName" th:field="*{displayName}" placeholder="Enter display name" required>
                    </div>
                </div>

                <!-- Registration Number -->
                <div class="form-group row">
                    <label for="regNo" class="col-sm-2 col-form-label">Reg No</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="regNo" name="regNo" th:field="*{regNo}" placeholder="Enter registration number" required>
                    </div>
                </div>

                <!-- NIC -->
                <div class="form-group row">
                    <label for="nic" class="col-sm-2 col-form-label">NIC</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="nic" name="nic" th:field="*{nic}" placeholder="Enter NIC" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group row">
                    <label for="phoneNumber" class="col-sm-2 col-form-label">Phone Number</label>
                    <div class="col-sm-10">
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" th:field="*{phoneNumber}" placeholder="Enter phone number" required>
                    </div>
                </div>

                <!-- issuedDate, expiryDate -->
                <div class="form-group row">
                    <label for="issuedDate" class="col-sm-2 col-form-label">Issued Date</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="issuedDate" name="issuedDate" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="expiryDate" class="col-sm-2 col-form-label">Expiry Date</label>
                    <div class="col-sm-10">
                        <input type="date" class="form-control" id="expiryDate" name="expiryDate" required>
                    </div>
                </div>

                <!-- Course Dropdown -->
                <div class="form-group row">
                    <label for="courseId" class="col-sm-2 col-form-label">Faculty</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="courseId" name="courseId" th:field="*{courseId}" required>
                            <option value="" disabled selected>Select a course</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.name}"></option>
                        </select>
                    </div>
                </div>

                <!-- Batch Dropdown -->
                <div class="form-group row">
                    <label for="batchId" class="col-sm-2 col-form-label">Class</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="batchId" name="batchId" th:field="*{batchId}" required>
                            <option value="" disabled selected>Select a batch</option>
                            <option th:each="batch : ${batches}"
                                    th:value="${batch.id}"
                                    th:text="${batch.name}"></option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-group row mt-4">
                    <div class="col-sm-12 text-right">
                        <button type="submit" class="btn btn-success">Register Student</button>
                        <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- ===== IMAGE CROP MODAL ===== -->
    <div class="modal fade" id="cropModal" tabindex="-1" role="dialog" aria-labelledby="cropModalLabel" aria-hidden="true"
         data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cropModalLabel">Crop Profile Image</h5>
                    <button type="button" class="close" onclick="cancelCrop()" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Cropper target -->
                    <div id="cropperContainer">
                        <img id="cropperImage" src="" alt="Crop preview">
                    </div>

                    <!-- Controls row -->
                    <div class="cropper-controls mt-3">
                        <!-- Aspect ratio -->
                        <span class="aspect-label">Ratio:</span>
                        <div id="cropRatioGroup" class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-outline-secondary active" onclick="setAspectRatio(1, this)" title="1:1 Square">1:1</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="setAspectRatio(3/4, this)" title="3:4 Portrait">3:4</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="setAspectRatio(NaN, this)" title="Free">Free</button>
                        </div>

                        <div class="ml-auto d-flex gap-2">
                            <!-- Rotate -->
                            <button type="button" class="btn btn-outline-secondary btn-icon btn-sm" onclick="cropperInstance.rotate(-90)" title="Rotate Left">
                                &#8634;
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-icon btn-sm" onclick="cropperInstance.rotate(90)" title="Rotate Right">
                                &#8635;
                            </button>
                            <!-- Flip -->
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="flipHorizontal()" title="Flip Horizontal">
                                &#8596;
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cancelCrop()">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="applyCrop()">
                        &#10003; Apply Crop
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding a New Batch -->
    <div class="modal fade" id="createBatchModal" tabindex="-1" role="dialog" aria-labelledby="createBatchModalLabel"
         aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                </div>
                <div class="modal-body">
                    <form th:action="@{/student/upload-student-excel}" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="file">Upload Student Excel</label>
                            <input type="file" class="form-control-file" id="file" name="file" accept=".xlsx,.xls" required>
                        </div>
                        <div class="form-group">
                            <label for="bulkIssuedDate">Default Issued Date</label>
                            <input type="date" class="form-control" id="bulkIssuedDate" name="issuedDate" required>
                        </div>
                        <div class="form-group">
                            <label for="bulkExpiryDate">Default Expiry Date</label>
                            <input type="date" class="form-control" id="bulkExpiryDate" name="expiryDate" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload &amp; Register</button>
                        <a href="/sample/student_format.xlsx" class="btn btn-secondary" download> Excel Format (sample) </a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera Capture Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" role="dialog" aria-labelledby="cameraModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Take a Photo</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <video id="camera" autoplay style="width: 100%; max-height: 300px;"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <button type="button" class="btn btn-success mt-2" onclick="capturePhoto()">Capture</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

    <script>
        // ─── Crop modal state ──────────────────────────────────────────────────────
        let cropperInstance = null;
        let flipScaleX = 1; // track horizontal flip state

        /**
         * Called when the user picks a file via the browse input.
         * Loads the image into Cropper.js and opens the crop modal.
         */
        function openCropModal(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                loadImageIntoCropper(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        /**
         * Loads a base64 data URL into the Cropper modal.
         * Used by both file-browse and camera capture paths.
         */
        function loadImageIntoCropper(dataURL) {
            const cropImg = document.getElementById('cropperImage');

            // Destroy previous instance if any
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }

            // Reset flip state
            flipScaleX = 1;

            // Reset active ratio button to 1:1
            document.querySelectorAll('#cropRatioGroup .btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('#cropRatioGroup .btn').classList.add('active');

            cropImg.src = dataURL;

            // Show modal, then init Cropper (modal must be visible first)
            $('#cropModal').modal('show');

            $('#cropModal').one('shown.bs.modal', function () {
                cropperInstance = new Cropper(cropImg, {
                    aspectRatio: 1,          // default 1:1 — square profile photo
                    viewMode: 1,             // restrict crop box within canvas
                    autoCropArea: 0.8,
                    movable: true,
                    zoomable: true,
                    rotatable: true,
                    scalable: true,
                    responsive: true,
                    background: true,
                });
            });
        }

        /** Change aspect ratio from the button group */
        function setAspectRatio(ratio, btn) {
            if (cropperInstance) cropperInstance.setAspectRatio(ratio);
            document.querySelectorAll('#cropRatioGroup .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        /** Flip image horizontally (toggle) */
        function flipHorizontal() {
            if (!cropperInstance) return;
            flipScaleX = flipScaleX === 1 ? -1 : 1;
            cropperInstance.scaleX(flipScaleX);
        }

        /**
         * Apply the crop: get canvas → convert to Blob → inject into file input
         * → update preview → close modal.
         */
        function applyCrop() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                width: 400,
                height: 400,
                imageSmoothingQuality: 'high',
            });

            // Update the visible preview immediately
            const imagePreview = document.getElementById('imagePreview');
            imagePreview.src = canvas.toDataURL('image/jpeg', 0.92);
            imagePreview.style.display = 'block';

            // Convert canvas → Blob → File → inject into the file input
            canvas.toBlob(function (blob) {
                const croppedFile = new File([blob], 'profile_cropped.jpg', { type: 'image/jpeg' });

                const fileInput = document.getElementById('image');
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(croppedFile);
                fileInput.files = dataTransfer.files;

                // Clean up cropper and close modal
                cropperInstance.destroy();
                cropperInstance = null;
                $('#cropModal').modal('hide');
            }, 'image/jpeg', 0.92);
        }

        /**
         * Cancel crop: reset the file input so no stale selection remains,
         * destroy the cropper instance, close the modal.
         */
        function cancelCrop() {
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            // Clear the file input so the user can re-select if they want
            const fileInput = document.getElementById('image');
            fileInput.value = '';

            $('#cropModal').modal('hide');
        }

        // ─── Camera ───────────────────────────────────────────────────────────────
        let videoStream;

        function openCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    videoStream = stream;
                    document.getElementById('camera').srcObject = stream;
                    $('#cameraModal').modal('show');
                })
                .catch(error => {
                    alert("Camera access denied or not available.");
                    console.error(error);
                });
        }

        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataURL = canvas.toDataURL('image/png');

            // Stop camera and close camera modal first
            videoStream.getTracks().forEach(track => track.stop());
            $('#cameraModal').modal('hide');

            // Open crop modal with the captured photo
            $('#cameraModal').one('hidden.bs.modal', function () {
                loadImageIntoCropper(imageDataURL);
            });
        }
    </script>

</section>
</body>
</html>
