<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Student List</title>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Students</h2>
            <p class="text-muted">Manage student records and details here.</p>
        </div>
        <div class="col-6 text-right">
            <a th:href="@{/student/student-add}" class="btn btn-primary">Add New Student</a>
            <button class="btn btn-success" onclick="printAllIdCards()">Print All</button>
        </div>
    </div>

    <!-- Student Table -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Student List</h4>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Reg Number</th>
                                <th>Phone Number</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student, iterStat : ${students}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.regNo}"></td>
                                <td th:text="${student.phoneNumber}"></td>
                                <td>
                                    <!-- Edit Button -->
                                    <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-sm btn-info">
                                        Edit
                                    </a>

                                    <!-- Delete Button with Confirmation -->
                                    <form th:action="@{/student/delete/{id}(id=${student.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure you want to delete this student?');">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>

                                    <!-- Print Button -->
                                    <button class="btn btn-sm btn-warning"
                                            th:data-id="${student.id}"
                                            onclick="printIdCard(this)">
                                        Print ID Card
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="5" class="text-center">No students found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔥 Hidden iframe for ID Card -->
    <iframe id="printFrame" style="display:none;"></iframe>

    <script>
        function printIdCard(button) {
            let studentId = button.getAttribute("data-id");
            let iframe = document.getElementById("printFrame");

            // Load the student ID card inside the iframe
            iframe.src = "/student/generate-id/" + studentId;

            // Wait for iframe to load, then print
            iframe.onload = function() {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            };
        }

        function printAllIdCards() {
            window.open("/student/generate-all-ids", "_blank");
        }
    </script>
</section>
</body>
</html>
