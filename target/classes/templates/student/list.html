<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Student List</title>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Students</h2>
            <p class="text-muted">Manage student records and details here.</p>
        </div>
        <div class="col-6 text-right">
            <a th:href="@{/student/student-add}" class="btn btn-primary">Add New Student</a>
        </div>
    </div>

    <!-- Filters -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="card">
                <div class="card-body py-3">
                    <form th:action="@{/student/student-list}" method="get" id="filterForm">
                        <input type="hidden" name="size" th:value="${students.size}"/>
                        <div class="form-row align-items-end">
                            <div class="form-group col-md-3 mb-2">
                                <label class="small mb-1">Search</label>
                                <input type="text" class="form-control form-control-sm" name="search"
                                       placeholder="Name / Reg No / NIC"
                                       th:value="${selectedSearch}"/>
                            </div>
                            <div class="form-group col-md-2 mb-2">
                                <label class="small mb-1">Course</label>
                                <select class="form-control form-control-sm" name="courseId">
                                    <option value="">All Courses</option>
                                    <option th:each="course : ${courses}"
                                            th:value="${course.id}"
                                            th:text="${course.name}"
                                            th:selected="${selectedCourseId != null and selectedCourseId == course.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group col-md-2 mb-2">
                                <label class="small mb-1">Batch</label>
                                <select class="form-control form-control-sm" name="batchId">
                                    <option value="">All Batches</option>
                                    <option th:each="batch : ${batches}"
                                            th:value="${batch.id}"
                                            th:text="${batch.name}"
                                            th:selected="${selectedBatchId != null and selectedBatchId == batch.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group col-md-2 mb-2">
                                <label class="small mb-1">Card Status</label>
                                <select class="form-control form-control-sm" name="cardStatus">
                                    <option value="">All</option>
                                    <option value="PRINT_PENDING"    th:selected="${selectedCardStatus == 'PRINT_PENDING'}">Print Pending</option>
                                    <option value="PDF_GENERATED"    th:selected="${selectedCardStatus == 'PDF_GENERATED'}">PDF Generated</option>
                                    <option value="PRINTED"          th:selected="${selectedCardStatus == 'PRINTED'}">Printed</option>
                                    <option value="ISSUED"           th:selected="${selectedCardStatus == 'ISSUED'}">Issued</option>
                                </select>
                            </div>
                            <div class="form-group col-md-2 mb-2">
                                <label class="small mb-1">Confirmation</label>
                                <select class="form-control form-control-sm" name="confirmationStatus">
                                    <option value="">All</option>
                                    <option value="PENDING"     th:selected="${selectedConfirmationStatus == 'PENDING'}">Pending</option>
                                    <option value="CONFIRMED"   th:selected="${selectedConfirmationStatus == 'CONFIRMED'}">Confirmed</option>
                                    <option value="UNCONFIRMED" th:selected="${selectedConfirmationStatus == 'UNCONFIRMED'}">Unconfirmed</option>
                                </select>
                            </div>
                            <div class="form-group col-md-1 mb-2 d-flex">
                                <button type="submit" class="btn btn-sm btn-primary mr-1">Filter</button>
                                <a th:href="@{/student/student-list}" class="btn btn-sm btn-secondary">Clear</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Table -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Student List
                        <small class="text-muted" th:text="'(' + ${students.totalElements} + ' students)'"></small>
                    </h4>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Reg Number</th>
                                <th>Phone Number</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student, iterStat : ${students.content}">
                                <td th:text="${iterStat.index + 1 + (students.number * students.size)}"></td>
                                <td th:text="${student.fullName}"></td>
                                <td th:text="${student.regNo}"></td>
                                <td th:text="${student.phoneNumber}"></td>
                                <td>
                                    <!-- Edit Button -->
                                    <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-sm btn-info">
                                        Edit
                                    </a>

                                    <!-- Reprint Button -->
                                    <button class="btn btn-sm btn-warning"
                                            th:data-id="${student.id}"
                                            th:data-name="${student.fullName}"
                                            onclick="openReprintModal(this)">
                                        Reprint ID Card
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students.content)}">
                                <td colspan="5" class="text-center">No students found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination Controls -->
                    <div th:if="${students.totalPages > 1}" class="mt-4">
                        <nav aria-label="Page navigation">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${students.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/student/student-list(page=${students.number - 1}, size=${students.size}, search=${selectedSearch}, courseId=${selectedCourseId}, batchId=${selectedBatchId}, cardStatus=${selectedCardStatus}, confirmationStatus=${selectedConfirmationStatus})}" aria-label="Previous">
                                        <span aria-hidden="true">&laquo;</span>
                                    </a>
                                </li>
                                <li th:each="p : ${#numbers.sequence(0, students.totalPages - 1)}"
                                    class="page-item" th:classappend="${p == students.number} ? 'active'">
                                    <a class="page-link" th:href="@{/student/student-list(page=${p}, size=${students.size}, search=${selectedSearch}, courseId=${selectedCourseId}, batchId=${selectedBatchId}, cardStatus=${selectedCardStatus}, confirmationStatus=${selectedConfirmationStatus})}" th:text="${p + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${students.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/student/student-list(page=${students.number + 1}, size=${students.size}, search=${selectedSearch}, courseId=${selectedCourseId}, batchId=${selectedBatchId}, cardStatus=${selectedCardStatus}, confirmationStatus=${selectedConfirmationStatus})}" aria-label="Next">
                                        <span aria-hidden="true">&raquo;</span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                        <div class="text-center mt-2">
                            <form th:action="@{/student/student-list}" method="get">
                                <input type="hidden" name="search"              th:value="${selectedSearch}"/>
                                <input type="hidden" name="courseId"            th:value="${selectedCourseId}"/>
                                <input type="hidden" name="batchId"             th:value="${selectedBatchId}"/>
                                <input type="hidden" name="cardStatus"          th:value="${selectedCardStatus}"/>
                                <input type="hidden" name="confirmationStatus"  th:value="${selectedConfirmationStatus}"/>
                                <label for="size">Items per page:</label>
                                <select id="size" name="size" onchange="this.form.submit()">
                                    <option value="10"  th:selected="${students.size == 10}">10</option>
                                    <option value="20"  th:selected="${students.size == 20}">20</option>
                                    <option value="50"  th:selected="${students.size == 50}">50</option>
                                    <option value="100" th:selected="${students.size == 100}">100</option>
                                </select>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Reprint Modal -->
    <div class="modal fade" id="reprintModal" tabindex="-1" role="dialog" aria-labelledby="reprintModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reprintModalLabel">Reprint ID Card</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="reprintForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <p>Student: <strong id="reprintStudentName"></strong></p>
                        <div class="form-group">
                            <label for="requestReason">Request Reason</label>
                            <textarea class="form-control" id="requestReason" name="requestReason"
                                      rows="3" maxlength="500"
                                      placeholder="Enter the reason for reprint (e.g. lost, damaged)..."
                                      required></textarea>
                        </div>
                        <p class="text-muted mb-0" style="font-size: 0.85em;">
                            The current card will be deactivated and a new card will be added to the Pending Print list.
                        </p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning">Send to Pending Print</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openReprintModal(button) {
            const studentId   = button.getAttribute('data-id');
            const studentName = button.getAttribute('data-name');
            document.getElementById('reprintStudentName').textContent = studentName;
            document.getElementById('reprintForm').action = '/student/request-reprint/' + studentId;
            document.getElementById('requestReason').value = '';
            $('#reprintModal').modal('show');
        }

        document.getElementById('reprintForm').addEventListener('submit', function (e) {
            const reason = document.getElementById('requestReason').value.trim();
            if (!reason) {
                e.preventDefault();
                document.getElementById('requestReason').focus();
                alert('Please enter a request reason before submitting.');
            }
        });
    </script>
</section>
</body>
</html>
