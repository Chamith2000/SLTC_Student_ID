spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true

spring.devtools.restart.enabled=false

server.servlet.session.timeout=120m

spring.thymeleaf.expression-enabled=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# File path
#archive.path = /var/app/studentidgen/uploads/image/student/profile
archive.path = /home/chamith/Music/SLTC-Student_ID-Localhost-images
server.file.prefix = files

# logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.file.name= /var/app/studentidgen/logs/studentidgen.log

logging.file.path=logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Tell Spring Boot it's behind a reverse proxy with HTTPS
server.forward-headers-strategy=framework

# Configure session cookies for HTTPS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=1800
